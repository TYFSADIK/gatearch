# Local stack: Apache + PHP 8.3 and MySQL 8.
#   cp .env.example .env    # then set real passwords
#   docker compose up -d --build
#   docker compose exec web php bin/seed-demo.php      (optional demo data)
#   open http://localhost:8080
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      GATEARCH_DB_DSN: "mysql:host=db;dbname=gatearch;charset=utf8mb4"
      GATEARCH_DB_USER: gatearch
      GATEARCH_DB_PASS: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gatearch
      MYSQL_USER: gatearch
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

volumes:
  db-data:
